# Secrets & egress security — enforce no hardcoded secrets and no weak crypto
# from the secrets-egress-security knowledge bundle.
name = "secrets-egress-security"
description = "Block hardcoded credentials, weak crypto, and unsafe C functions"
enabled = true
severity = "error"

[[rules]]
name = "no-secrets-in-shared"
pattern = "**/*.{ts,js,rs,py,go,java,rb}"
check_content = true
content_pattern = "(AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[0-9A-Z]{16}"
condition = "contains"
severity = "error"
message = "AWS access keys must not be hardcoded in source files."

[[rules]]
name = "no-hardcoded-credentials"
pattern = "**/*.{ts,js,rs,py,go,java,rb}"
check_content = true
content_pattern = "(password|secret|api_key|token)\\s*=\\s*['\"][^'\"]{8,}['\"]"
condition = "contains"
exception_pattern = "test|spec|example|mock"
severity = "error"
message = "Hardcoded credentials detected; move to environment variables or a secret manager."

[[rules]]
name = "no-weak-crypto"
pattern = "**/*.{ts,js,rs,py,go}"
check_content = true
content_pattern = "\\b(MD5|md5|SHA-?1|sha-?1|DES|des|RC4|rc4)\\b"
condition = "contains"
exception_pattern = "test|spec|sha256|sha512"
severity = "warning"
message = "Weak/broken crypto algorithm detected; use SHA-256+ or AES-GCM/ChaCha20."

[[rules]]
name = "no-unsafe-c-functions"
pattern = "**/*.{c,h}"
check_content = true
content_pattern = "\\b(gets|strcpy|sprintf)\\s*\\("
condition = "contains"
severity = "error"
message = "Unsafe C function detected; use bounds-checked alternatives (fgets, snprintf)."
