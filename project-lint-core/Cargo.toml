[package]
name = "project-lint-core"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Core library for project-lint - hook engine, mappers, config, profiles, and scanners"
license = "MIT"
repository = "https://github.com/yourusername/project-lint"

[dependencies]
# Configuration
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# File system operations
walkdir = "2.4"

# Git integration
git2 = "0.20"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Terminal output
colored = "2.0"

# Path and environment
dirs = "5.0"
glob = "0.3"
regex = "1.10"

# AST-based code analysis
tree-sitter = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.23"
tree-sitter-yaml = "0.7"
tree-sitter-toml = "0.20"

# Dependency version checking
semver = "1.0"

# Content hashing for duplicate-binary detection
sha2 = "0.10"

# Force newer versions of transitive dependencies to fix security issues
lru = "0.16"

[dev-dependencies]
tempfile = "3.8"
assert_fs = "1.1"
tokio-test = "0.4"
serial_test = "2.0"
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "rule_engine"
harness = false

[[bench]]
name = "scanners"
harness = false
